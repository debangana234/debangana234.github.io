<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 2100" role="img" aria-labelledby="title desc">
  <title id="title">Longitudinal progression of Parkinson's disease</title>
  <desc id="desc">Progression schematic from healthy control to prodromal Parkinson's disease and clinical Parkinson's disease, with bold labels for website display.</desc>
  <image href="longitudinal-parkinson-progression.png" width="3000" height="2100"/>

  <style>
    .label {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      fill: #111111;
      letter-spacing: 0;
    }
    .title-text {
      font-size: 62px;
    }
    .diagonal {
      font-size: 64px;
    }
    .bottom {
      font-size: 56px;
    }
  </style>

  <rect x="820" y="92" width="1420" height="98" fill="#ffffff"/>
  <text class="label title-text" x="1500" y="162" text-anchor="middle">Longitudinal Progression of Parkinson's Disease</text>

  <rect x="410" y="415" width="590" height="420" fill="#ffffff" transform="rotate(-43 705 625)"/>
  <text class="label diagonal" x="445" y="725" transform="rotate(-43 445 725)">Blood DNA methylation</text>

  <rect x="1108" y="405" width="780" height="420" fill="#ffffff" transform="rotate(-43 1498 615)"/>
  <text class="label diagonal" x="1134" y="725" transform="rotate(-43 1134 725)">DNA methylation alterations</text>

  <rect x="1832" y="436" width="810" height="410" fill="#ffffff" transform="rotate(-42 2237 641)"/>
  <text class="label diagonal" x="1854" y="732" transform="rotate(-42 1854 732)">neuron loss and degeneration</text>

  <rect x="2480" y="374" width="610" height="410" fill="#ffffff" transform="rotate(-44 2785 579)"/>
  <text class="label diagonal" x="2508" y="690" transform="rotate(-44 2508 690)">lewy body accumulation</text>

  <rect x="264" y="1558" width="470" height="84" fill="#ffffff"/>
  <text class="label bottom" x="502" y="1618" text-anchor="middle">Healthy control</text>

  <rect x="1035" y="1555" width="935" height="230" fill="#ffffff"/>
  <text class="label bottom" x="1050" y="1615">Prodromal PD | ongoing</text>
  <text class="label bottom" x="1050" y="1695">neurodegeneration | epigenetic</text>
  <text class="label bottom" x="1050" y="1775">alterations detectable in blood</text>

  <rect x="2182" y="1555" width="775" height="230" fill="#ffffff"/>
  <text class="label bottom" x="2198" y="1615">Clinical PD | Motor</text>
  <text class="label bottom" x="2198" y="1695">Symptoms | Advanced alpha-</text>
  <text class="label bottom" x="2198" y="1775">synuclein pathology</text>
</svg>
