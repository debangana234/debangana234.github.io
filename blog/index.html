<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Blog by Debangana Chakraborty.">
  <title>Blog | Debangana Chakraborty</title>
  <style>
    :root {
      --bg: #15181d;
      --text: #e6edf3;
      --muted: #aab4c0;
      --line: #343a43;
      --link: #8ecae6;
      --accent: #7fc8b6;
      --surface: #1e232b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.68;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0;
    }

    nav {
      margin-bottom: 36px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    nav a {
      margin-right: 18px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.12;
    }

    .subtitle {
      max-width: 680px;
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .blog-card {
      display: block;
      min-height: 180px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      background: var(--surface);
      color: var(--text);
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .blog-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      text-decoration: none;
    }

    .blog-card h2 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 1.18rem;
      line-height: 1.35;
    }

    .blog-card p {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .blog-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav aria-label="Blog navigation">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
    </nav>

    <main>
      <h1>Blog</h1>
      <p class="subtitle">Notes, essays, and writing outside the main research pages.</p>

      <div class="blog-grid">
        <a class="blog-card" href="/blog/understanding-fundamentals-in-science/">
          <h2>Understanding fundamentals in science</h2>
          <p>Intuitive explanations of mathematical and scientific concepts for machine learning, data science, and computational biology.</p>
        </a>

        <a class="blog-card" href="/blog/poem/">
          <h2>Poem</h2>
          <p>A space for poems and reflective writing.</p>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
